const TBL={suppliers:"mo_suppliers",contracts:"mo_contracts",contract_items:"mo_contract_items",
  receivers:"mo_receivers",projects:"mo_projects",orders:"mo_orders",order_items:"mo_order_items"};
const RPC_NEXT="mo_next_order_number";

async function dbList(table){
  if(state.demo) return clone(demo[table]);
  const {data,error}=await state.sb.from(TBL[table]).select("*");
  if(error) throw error; return data;
}
async function dbInsert(table,row){
  if(state.demo){const r={...row,id:row.id||uid()};demo[table].push(r);return clone(r);}
  const {data,error}=await state.sb.from(TBL[table]).insert(row).select().single();
  if(error) throw error; return data;
}
async function dbUpdate(table,id,patch){
  if(state.demo){const r=byId(demo[table],id);if(r)Object.assign(r,patch);return clone(r);}
  const {data,error}=await state.sb.from(TBL[table]).update(patch).eq("id",id).select().single();
  if(error) throw error; return data;
}
async function dbDelete(table,id){
  if(state.demo){demo[table]=demo[table].filter(x=>x.id!==id);return;}
  const {error}=await state.sb.from(TBL[table]).delete().eq("id",id);

}

/* Καθολικό cache (φορτώνεται στην εκκίνηση) */
const cache={suppliers:[],contracts:[],contract_items:[],receivers:[],projects:[],orders:[]};

async function loadOrders(){
  if(state.demo){return clone(demo.orders).sort(sortOrders);}
  const {data:orders,error}=await state.sb.from(TBL.orders).select("*").order("order_date",{ascending:false}).order("order_no",{ascending:false});
  if(error) throw error;
  const {data:items,error:e2}=await state.sb.from(TBL.order_items).select("*");
  if(e2) throw e2;
  orders.forEach(o=>o.items=items.filter(it=>it.order_id===o.id));
  return state.profile?.role==="unit_user"?orders.filter(o=>Number(o.municipal_unit_id)===Number(state.profile.municipal_unit_id)):orders;
}
function sortOrders(a,b){ return (b.order_date||"").localeCompare(a.order_date||"") || (b.order_no||"").localeCompare(a.order_no||""); }

async function nextOrderNo(year){
  const pref=state.settings.orderPrefix||"ΕΥ";
  if(state.demo){const k="order-"+year;demo.counters[k]=(demo.counters[k]||1)+1;return `${pref}-${year}-${String(demo.counters[k]).padStart(4,"0")}`;}
  const {data,error}=await state.sb.rpc(RPC_NEXT,{p_scope:"order-"+year});
  if(error) throw error;
  return `${pref}-${year}-${String(data).padStart(4,"0")}`;
}

/* ============================================================================
   ΥΠΟΛΟΓΙΣΜΟΙ ΣΥΜΒΑΣΗΣ (υπόλοιπο)
============================================================================ */
function contractSpent(contractId,exceptOrderId){
  return cache.orders
    .filter(o=>o.contract_id===contractId && o.status!=="cancelled" && o.id!==exceptOrderId)
    .reduce((s,o)=>s+num(o.subtotal),0);
}
function contractBalance(contractId,exceptOrderId){
  const c=byId(cache.contracts,contractId);
  const total=c?num(c.total_amount):0;
  const spent=contractSpent(contractId,exceptOrderId);
  return {total,spent,remaining:total-spent};
}

/* ---- Ανάλωση ανά είδος σύμβασης & αντιστοιχίσεις εκτός-τιμολογίου ---- */
function parseMapping(it){
  const m=it&&it.mapping;
  if(!m) return [];
  if(Array.isArray(m)) return m;
  try{const a=JSON.parse(m);return Array.isArray(a)?a:[];}catch{return [];}
}
function mappingCovered(line){
  return parseMapping(line).reduce((s,m)=>{
    const ci=byId(cache.contract_items,m.contract_item_id);
    return s+(ci?num(m.qty)*num(ci.unit_price):0);
  },0);
}
function itemConsumedQty(contractItemId,exceptOrderId){
  let q=0;
  for(const o of cache.orders){
    if(o.status==="cancelled"||o.id===exceptOrderId) continue;
    for(const it of (o.items||[])){
      if(it.contract_item_id===contractItemId) q+=num(it.quantity);
      for(const m of parseMapping(it)) if(m.contract_item_id===contractItemId) q+=num(m.qty);
    }
  }
  return q;
}
function itemRemainingQty(contractItemId,exceptOrderId){
  const ci=byId(cache.contract_items,contractItemId);
  if(!ci||ci.contract_qty==null||ci.contract_qty==="") return null;
  return num(ci.contract_qty)-itemConsumedQty(contractItemId,exceptOrderId);
}
function mappingNoteText(it){
  if(!it||!it.is_custom) return "";
  const arr=parseMapping(it); if(!arr.length) return "";
  return "Εκτός τιμολογίου — χρέωση ως: "+arr.map(m=>{
    const ci=byId(cache.contract_items,m.contract_item_id)||{};
    return `${qty(m.qty)} ${ci.unit||""} × ${ci.code?ci.code+" ":""}${ci.description||"—"}`;
  }).join("  +  ");
}
function codePrefixHTML(it){
  const ci=it&&it.contract_item_id?byId(cache.contract_items,it.contract_item_id):null;
  return ci&&ci.code?`<span style="color:#666">${esc(ci.code)}</span> — `:"";
}

/* Συλλογή φόρμας -> αντικείμενο εντολής */
function collect(){
  const f=state.form;
  const items=f.items.filter(it=>(it.description||"").trim()!=="" || num(it.quantity)>0)
    .map(it=>({
      contract_item_id:it.ref||null,
      is_custom:!it.ref,
      description:(it.description||"").trim(),unit:(it.unit||"").trim(),
      quantity:num(it.quantity),unit_price:num(it.unit_price),
      mapping:(!it.ref&&parseMapping(it).length)?parseMapping(it).map(m=>({contract_item_id:m.contract_item_id,qty:num(m.qty)})).filter(m=>m.qty>0):null
    }));
  const subtotal=items.reduce((s,it)=>s+it.quantity*it.unit_price,0);
  const vr=num(f.vat_rate); const vat=subtotal*vr/100;
  return {id:f.id,order_no:f.order_no,order_date:f.order_date,supplier_id:f.supplier_id,contract_id:f.contract_id,
    receiver_id:f.receiver_id,project_id:null,usage_location:"",municipal_unit_id:f.municipal_unit_id||state.selectedUnitId,source_study_id:f.source_study_id||state.selectedStudyId,
    notes:(f.notes||"").trim(),vat_rate:vr,status:f.status||"draft",items,subtotal,vat,total:subtotal+vat};
}
function validate(o,{needSend=false}={}){
  const errs=[];
  if(!o.supplier_id) errs.push("Επίλεξε προμηθευτή.");
  if(!o.contract_id) errs.push("Επίλεξε σύμβαση.");
  if(!o.items.length) errs.push("Πρόσθεσε τουλάχιστον ένα είδος με ποσότητα.");
  if(o.items.some(it=>!it.description)) errs.push("Κάθε γραμμή χρειάζεται περιγραφή είδους.");
  if(o.items.some(it=>it.quantity<=0)) errs.push("Κάθε είδος χρειάζεται ποσότητα > 0.");
  if(needSend){
    const sup=byId(cache.suppliers,o.supplier_id);
    if(!sup?.email) errs.push("Ο προμηθευτής δεν έχει email — συμπλήρωσέ το στην καρτέλα του.");
    if(o.contract_id){
      for(const it of o.items){
        if(it.is_custom){
          const c=it.quantity*it.unit_price;
          if(c>0 && mappingCovered(it)<c-0.005){
            errs.push(`Το είδος «${it.description}» είναι εκτός τιμολογίου — όρισε πλήρη αντιστοίχιση με είδη της σύμβασης (κουμπί «⇄»).`);
            break;
          }
        }
      }
    }
  }
  return errs;
}

    vat_rate:o.vat_rate,subtotal:o.subtotal,vat:o.vat,total:o.total,status:o.status,

function buildMailtoUrl(payload,bodyText){
  const to=(payload.to||[]).filter(Boolean).join(",");
  const params=[];
  if(payload.cc && payload.cc.length) params.push("cc="+encodeURIComponent(payload.cc.join(",")));
  params.push("subject="+encodeURIComponent(payload.subject||""));
  params.push("body="+encodeURIComponent(bodyText||""));
  return "mailto:"+to+(params.length?"?"+params.join("&"):"");
}

/* ============================================================================
   ΕΙΣΑΓΩΓΗ ΤΙΜΟΛΟΓΙΟΥ ΣΥΜΒΑΣΗΣ ΑΠΟ EXCEL (πρότυπο κλειδωμένης μελέτης)
   Αναμενόμενες στήλες: Α/Α | Κωδικός | Περιγραφή είδους | Μονάδα | CPV | Ποσότητα | Τιμή | Δαπάνη
============================================================================ */
function readFileAsArrayBuffer(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("Αποτυχία ανάγνωσης αρχείου."));r.readAsArrayBuffer(file);});
}
async function parseTimologioXlsx(file){
  if(!window.XLSX) throw new Error("Δεν φορτώθηκε η βιβλιοθήκη Excel — έλεγξε τη σύνδεση στο διαδίκτυο.");
  const buf=await readFileAsArrayBuffer(file);
  const wb=XLSX.read(new Uint8Array(buf),{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  let hi=-1,map={};
  for(let i=0;i<Math.min(rows.length,15);i++){
    const low=(rows[i]||[]).map(c=>String(c).toLowerCase());
    const di=low.findIndex(c=>c.includes("περιγραφ"));
    if(di>=0){
      hi=i; map.desc=di;
      map.code =low.findIndex(c=>c.includes("κωδ"));
      map.unit =low.findIndex(c=>c.includes("μονάδ")||c.trim()==="μ.μ."||c.includes("μον."));
      map.cpv  =low.findIndex(c=>c.includes("cpv"));
      map.qty  =low.findIndex(c=>c.includes("ποσότ"));
      map.price=low.findIndex(c=>c.includes("τιμή"));
      break;
    }
  }
  if(hi<0) throw new Error("Δεν βρέθηκε γραμμή επικεφαλίδων (στήλη «Περιγραφή»). Έλεγξε ότι το φύλλο ακολουθεί το πρότυπο.");
  const items=[]; let netTotal=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[];
    const rowTxt=r.map(c=>String(c).toLowerCase()).join(" ");
    if(rowTxt.includes("καθαρή αξία")){
      const nums=r.filter(c=>typeof c==="number");
      if(nums.length) netTotal=nums[nums.length-1];
      continue;
    }
    const d=String(r[map.desc]??"").trim();
    if(!d) continue;
    const price=map.price>=0?num(r[map.price]):0;
    const qv=map.qty>=0&&String(r[map.qty]).trim()!==""?num(r[map.qty]):null;
    if(!(price>0)&&!(qv>0)) continue;
    items.push({
      code:map.code>=0?String(r[map.code]??"").trim():"",
      description:d,
      unit:map.unit>=0?String(r[map.unit]??"").trim():"",
      cpv:map.cpv>=0?String(r[map.cpv]??"").trim():"",
      contract_qty:qv,
      unit_price:price
    });
  }
  if(!items.length) throw new Error("Δεν βρέθηκαν είδη στο αρχείο.");
  if(!netTotal) netTotal=items.reduce((s,x)=>s+(num(x.contract_qty)||0)*x.unit_price,0);
  return {items,netTotal:Math.round(netTotal*100)/100};
}

async function delContract(id){
  if(cache.orders.some(o=>o.contract_id===id)){toast("Υπάρχουν εντολές σε αυτή τη σύμβαση — δεν διαγράφεται.","warn");return;}

  );
  openModal("Μαζική επικόλληση ειδών",body,[
    {label:"Άκυρο",cls:"btn",act:closeModal},
    {label:"Εισαγωγή",cls:"btn primary",act:async()=>{
      const lines=(f.txt||"").split("\n").map(l=>l.trim()).filter(Boolean);
      let n=cache.contract_items.filter(i=>i.contract_id===contractId).length;

  ]);
}

  const body=el("div",{},field("Ονομασία έργου/χρήσης *","name","text",p.name,f),field("Κωδικός","code","text",p.code,f,"π.χ. ΑΥΤ-2026-03"));
  openModal(isNew?"Νέο έργο":"Επεξεργασία",body,[
    {label:"Άκυρο",cls:"btn",act:closeModal},
    {label:"Αποθήκευση",cls:"btn primary",act:async()=>{
      const data={name:val(f,"name",p.name),code:val(f,"code",p.code),active:true};
      if(!data.name.trim()){toast("Η ονομασία είναι υποχρεωτική.","warn");return;}
      try{if(isNew)await dbInsert("projects",data);else await dbUpdate("projects",p.id,data);cache.projects=await dbList("projects");closeModal();toast("Αποθηκεύτηκε.","ok");render();}catch(e){toast("Σφάλμα: "+(e.message||e),"err");}
    }}
  ]);
}
async function delProject(id){ if(!confirm("Διαγραφή;"))return; try{await dbDelete("projects",id);cache.projects=await dbList("projects");toast("Διαγράφηκε.","ok");render();}catch(e){toast("Σφάλμα: "+(e.message||e),"err");} }

/* Γενικός πίνακας (receivers/projects) */
function simpleTable(root,data,cols,onEdit,onDel,icon,emptyMsg){
  if(!data.length){root.append(el("div",{class:"card"},el("div",{class:"empty"},el("div",{class:"big"},icon),el("h3",{},emptyMsg),el("p",{},"Πρόσθεσε την πρώτη εγγραφή."))));return;}
  const tw=el("div",{class:"tablewrap"}); const tbl=el("table",{class:"mtable"});
  tbl.append(el("thead",{},el("tr",{},...cols.map(c=>el("th",{},c.h)),el("th",{style:"width:90px"},""))));
  const tb=el("tbody",{});
  data.forEach(row=>{
    tb.append(el("tr",{},...cols.map(c=>el("td",{style:c.w?"font-weight:600":""},c.f(row))),
      el("td",{},el("div",{class:"btnbar"},el("button",{class:"btn sm ghost",onclick:()=>onEdit(row)},"✎"),el("button",{class:"btn sm ghost danger",onclick:()=>onDel(row.id)},"🗑")))));
  });
  tbl.append(tb);tw.append(tbl);root.append(el("div",{class:"card"},tw));
}

/* ============================================================================
   ΒΟΗΘΗΤΙΚΑ ΦΟΡΜΑΣ / MODAL
============================================================================ */
function field(label,key,type,value,store,ph){
  const inp=el(type==="textarea"?"textarea":"input",{type:type==="textarea"?null:type,value:type==="textarea"?null:(value??""),placeholder:ph||""});
  if(type==="textarea") inp.value=value??"";
  store[key]=inp;
  return el("div",{class:"field"},el("label",{},label),inp);
}
function val(store,key,fallback){ return store[key]?store[key].value:(fallback??""); }
function row2(a,b){ return el("div",{class:"row r2"},a,b); }

function openModal(title,body,actions){
  const host=$("#modalHost"); host.innerHTML="";
  const foot=el("div",{class:"modal-f"});
  (actions||[]).forEach(a=>foot.append(el("button",{class:a.cls,onclick:a.act},a.label)));
  const overlay=el("div",{class:"overlay",onclick:e=>{if(e.target===overlay)closeModal();}},
    el("div",{class:"modal"},
      el("div",{class:"modal-h"},el("h3",{},title),el("button",{class:"x",onclick:closeModal},"×")),
      el("div",{class:"modal-b"},body),
      foot
    ));
  host.append(overlay);
  document.addEventListener("keydown",escClose);
}
function escClose(e){ if(e.key==="Escape")closeModal(); }
function closeModal(){ $("#modalHost").innerHTML=""; document.removeEventListener("keydown",escClose); }

/* ============================================================================
   AUTH (Supabase) — προαιρετικό
============================================================================ */
async function doLogin(){
  const email=$("#loginEmail").value.trim(), pass=$("#loginPass").value;
  const errBox=$("#loginErr"); errBox.classList.add("hidden");
  if(!email||!pass){errBox.textContent="Συμπλήρωσε email και κωδικό.";errBox.classList.remove("hidden");return;}
  try{
    const {data,error}=await state.sb.auth.signInWithPassword({email,password:pass});
    if(error) throw error;
    state.user=data.user; await afterAuth();
  }catch(e){ errBox.textContent="Αποτυχία σύνδεσης: "+(e.message||e); errBox.classList.remove("hidden"); }
}
async function doLogout(){ try{await state.sb.auth.signOut();}catch{} location.reload(); }

async function afterAuth(){
  $("#loginScreen").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#whoami").textContent=state.user?.email||"";
  $("#whoami").classList.toggle("hidden",EMBEDDED);$("#logoutBtn").classList.toggle("hidden",EMBEDDED);
  if(!state.demo){const {data,error}=await state.sb.from("profiles").select("role,municipal_unit_id,full_name,email").eq("id",state.user.id).single();if(error)throw error;state.profile=data;}
  document.querySelectorAll(".admin-only").forEach(x=>x.classList.toggle("hidden",!canManage()));
  await boot();
}

/* ============================================================================
   ΕΚΚΙΝΗΣΗ
============================================================================ */
async function boot(){
  try{ await reloadAll(); }
  catch(e){ toast("Σφάλμα φόρτωσης δεδομένων: "+(e.message||e),"err",6000); }
  state.form=blankForm();state.view="studies";if(EMBEDDED){document.body.classList.add("embedded");window.parent.postMessage({type:"material-orders-ready"},location.origin);}go("studies");
}

async function init(){
  state.settings={...DEFAULT_SETTINGS};
  $("#brandSub").textContent=state.settings.muniName;

  const haveCfg=CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase;
  if(haveCfg){
    try{
      state.sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
      state.demo=false;
      $("#modePill").textContent="LIVE"; $("#modePill").className="mode-pill mode-live";
      if(CONFIG.REQUIRE_LOGIN){
        const {data}=await state.sb.auth.getSession();
        if(data?.session){ state.user=data.session.user; await afterAuth(); return; }
        $("#app").classList.add("hidden"); $("#loginScreen").classList.remove("hidden"); return;
      } else { await boot(); return; }
    }catch(e){
      console.warn("Supabase init failed -> DEMO",e);
      state.demo=true; state.sb=null;
    }
  }
  /* DEMO */
  state.demo=true;
  $("#modePill").textContent="DEMO"; $("#modePill").className="mode-pill mode-demo";
  await boot();
}
window.addEventListener("message",e=>{if(e.origin!==location.origin)return;if(e.data?.type==="rhodes-year"){const u=new URL(location.href);u.searchParams.set("year",e.data.year);history.replaceState(null,"",u);state.selectedStudyId=null;state.form=blankForm();if(state.user)go("studies");}});
document.addEventListener("DOMContentLoaded",init);
</script>
